<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company | PlacementPro</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="form-container">
        <h1>Edit Company</h1>
        <p>Update the company details below.</p>

        <form method="POST">

            <div class="form-group">
                <label for="company_name">Company Name</label>
                <input
                    type="text"
                    id="company_name"
                    name="company_name"
                    value="{{ company[1] }}"
                    required>
            </div>

            <div class="form-group">
                <label for="industry">Industry</label>
                <input
                    type="text"
                    id="industry"
                    name="industry"
                    value="{{ company[2] or '' }}">
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ company[3] or '' }}">
            </div>

            <div class="form-group">
                <label for="hr_email">HR Email</label>
                <input
                    type="email"
                    id="hr_email"
                    name="hr_email"
                    value="{{ company[4] or '' }}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{{ url_for('companies') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</body>
</html>
