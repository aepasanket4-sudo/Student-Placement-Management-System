
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Job | PlacementPro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="form-container">

    <h1>Add New Job 💼</h1>
    <p>Enter the job opening details below.</p>

    <form method="POST">

        <div class="form-group">
            <label for="company_id">Company</label>

            <select id="company_id"
                    name="company_id"
                    required
                    style="width:100%; padding:13px 14px;
                           border:1px solid #293650;
                           border-radius:8px;
                           background:#0b1223;
                           color:#e5e7eb;">

                <option value="">Select a company</option>

                {% for company in companies %}
                    <option value="{{ company[0] }}">
                        {{ company[1] }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="form-group">
            <label for="job_title">Job Title</label>
            <input type="text"
                   id="job_title"
                   name="job_title"
                   maxlength="100"
                   placeholder="e.g. Python Developer"
                   required>
        </div>

        <div class="form-group">
            <label for="job_type">Job Type</label>
            <input type="text"
                   id="job_type"
                   name="job_type"
                   maxlength="50"
                   placeholder="e.g. Full-Time, Internship">
        </div>

        <div class="form-group">
            <label for="salary">Salary (₹)</label>
            <input type="number"
                   id="salary"
                   name="salary"
                   min="0"
                   max="99999999.99"
                   step="0.01"
                   placeholder="e.g. 600000">
        </div>

        <div class="form-group">
            <label for="minimum_cgpa">Minimum CGPA</label>
            <input type="number"
                   id="minimum_cgpa"
                   name="minimum_cgpa"
                   min="0"
                   max="9.99"
                   step="0.01"
                   placeholder="e.g. 7.50">
        </div>

        <div class="form-group">
            <label for="job_location">Job Location</label>
            <input type="text"
                   id="job_location"
                   name="job_location"
                   maxlength="100"
                   placeholder="e.g. Ahmedabad">
        </div>

        <div class="form-actions">

            <button type="submit"
                    class="btn btn-primary">
                Add Job
            </button>

            <a href="{{ url_for('jobs') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
